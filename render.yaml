databases:
  - name: reexam-db
    plan: free
    databaseName: reexammanagementsystemdb
    user: reexam

services:
  - type: web
    name: reexam-management-system
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: reexam-db
          property: connectionString
